function entryName(r){return r.partner?r.name+' / '+r.partner:r.name}
function isPro(cid){return D.subs.some(function(s){return s.coachId===cid&&s.active!==false})}
function rating(c){return c.rCnt?(c.rSum/c.rCnt).toFixed(1):'—'}
function cstat(c){var n=enrolls(c.id).length;
  if(n>=c.max)return{k:'bad',t:'Đã đầy'};
  if(n<c.min)return{k:'warn',t:'Cần thêm '+(c.min-n)+' học viên để mở lớp'};
  return{k:'ok',t:'Chắc chắn mở lớp'}}
function tcalc(t){var S=D.settings,n=entries(t.id).length,rev=n*t.fee,pay=rev*S.payFee/100,ref=Math.max(0,n-1)*t.cost.ref,
  fixed=t.cost.court+t.cost.staff+t.cost.prize+t.cost.misc,unit=t.fee*(1-S.payFee/100)-t.cost.ref,
  be=unit>0?Math.ceil(fixed/unit):Infinity;
  return{n:n,rev:rev,pay:pay,ref:ref,fixed:fixed,costs:pay+ref+fixed,profit:rev-pay-ref-fixed,be:be,unit:unit}}
function totals(){var S=D.settings,o={gmv:0,comm:0,cpay:0,subs:0,tfee:0,hold:0,tpay:0,tcost:0},i;
  D.enrollments.forEach(function(e){o.gmv+=e.price;o.comm+=e.commission;o.cpay+=e.payFee});
  D.subs.forEach(function(s){o.subs+=s.amount});
  D.tournaments.forEach(function(t){var c=tcalc(t);
    if(t.status==='open'){o.hold+=c.rev}else{o.tfee+=c.rev;o.tpay+=c.pay;o.tcost+=c.ref+c.fixed}});
  o.revenue=o.comm+o.subs+o.tfee;o.cost=o.cpay+o.tpay+o.tcost;o.profit=o.revenue-o.cost;return o}
function rname(total,r){var left=total-r;return left===1?'Chung kết':left===2?'Bán kết':left===3?'Tứ kết':'Vòng '+(r+1)}
function hhmm(m){var h=Math.floor(m/60),mm=m%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm}

function genBracket(t){
  var es=entries(t.id).map(function(r){return r.id}),n=es.length,size=2;
  while(size<n)size*=2;
  var rounds=[],cnt=size/2,r,i;
  for(r=0;cnt>=1;r++,cnt/=2){rounds.push([]);for(i=0;i<cnt;i++)rounds[r].push({a:null,b:null,sa:null,sb:null,w:null})}
  for(i=0;i<size/2;i++){var m=rounds[0][i];m.a=es[i]||null;m.b=es[size-1-i]||null;
    if(m.a&&!m.b){m.w=m.a;m.bye=true}else if(m.b&&!m.a){m.w=m.b;m.bye=true}}
  t.bracket={size:size,rounds:rounds};propagate(t);
  var k=0;rounds.forEach(function(rd){rd.forEach(function(m){if(m.bye)return;
    m.court=(k%t.courts)+1;m.time=hhmm(8*60+Math.floor(k/t.courts)*40);m.ref=REFS[k%REFS.length];k++})});
  t.status='closed'}
function propagate(t){var rs=t.bracket.rounds;
  rs.forEach(function(rd,r){if(r===0)return;rd.forEach(function(m,i){m.a=rs[r-1][2*i].w;m.b=rs[r-1][2*i+1].w})})}

function courseList(){var F=U.f,list=D.courses.filter(function(c){
    var co=coach(c.coachId);
    if(F.q&&(c.title+' '+co.name+' '+c.venue).toLowerCase().indexOf(F.q.toLowerCase())<0)return false;
    if(F.level&&c.level!==F.level)return false;if(F.area&&c.area!==F.area)return false;
    if(F.sched&&c.sched!==F.sched)return false;if(F.max&&c.price>+F.max)return false;return true});

function matchBox(t,m){var na=m.a?entryName(reg(m.a)):'—',nb=m.b?entryName(reg(m.b)):(m.bye?'Miễn đấu':'—');
  return '<div class="mbox"><div class="'+(m.w&&m.w===m.a?'w ':'')+(m.a&&reg(m.a).mine?'mine':'')+'"><span>'+esc(na)+'</span><span>'+(m.sa==null?'':m.sa)+'</span></div>'+
  '<div class="'+(m.w&&m.w===m.b?'w ':'')+(m.b&&reg(m.b).mine?'mine':'')+'"><span>'+esc(nb)+'</span><span>'+(m.sb==null?'':m.sb)+'</span></div>'+
  (m.bye?'':'<small>Sân '+m.court+' · '+m.time+' · '+esc(m.ref)+'</small>')+'</div>'}
function bracketHtml(t){var b=t.bracket;return '<div class="bracket">'+b.rounds.map(function(rd,r){return '<div class="round"><h4>'+rname(b.rounds.length,r)+'</h4>'+rd.map(function(m){return matchBox(t,m)}).join('')+'</div>'}).join('')+'</div>'+
  (t.champion?'<div class="note ok">Vô địch: '+esc(entryName(reg(t.champion)))+'</div>':'')}
function resultsHtml(t){var b=t.bracket,out=[];
  b.rounds.forEach(function(rd,r){rd.forEach(function(m,i){if(!m.a||!m.b||m.bye||m.w)return;
    var nx=b.rounds[r+1]&&b.rounds[r+1][Math.floor(i/2)],locked=nx&&nx.w;
    out.push('<form class="row" data-form="result" data-t="'+t.id+'" data-r="'+r+'" data-i="'+i+'"><span style="flex:1;min-width:200px"><strong>'+rname(b.rounds.length,r)+'</strong> · '+esc(entryName(reg(m.a)))+' vs '+esc(entryName(reg(m.b)))+'</span>'+
      '<input name="sa" type="number" min="0" max="30" style="width:72px" value="'+(m.sa==null?'':m.sa)+'" '+(locked?'disabled':'')+' aria-label="Điểm bên A"><input name="sb" type="number" min="0" max="30" style="width:72px" value="'+(m.sb==null?'':m.sb)+'" '+(locked?'disabled':'')+' aria-label="Điểm bên B">'+
      '<button class="btn alt sm" type="submit"'+(locked?' disabled':'')+'>Lưu</button></form>')})});
  return out.length?'<div class="sec">'+out.join('')+'</div>':'<p class="muted sm">'+(t.champion?'Tất cả trận đã có kết quả.':'Chưa có trận nào đủ hai bên.')+'</p>'}

var ROLES=[['player','Học viên'],['coach','HLV'],['admin','Ban tổ chức']];
var TABS={player:[['courses','Khóa học'],['tours','Giải đấu'],['mine','Của tôi']],coach:[['overview','Tổng quan'],['create','Tạo khóa học'],['pro','Coach Pro']],admin:[['revenue','Doanh thu'],['tours','Giải đấu'],['assume','Giả định'],['log','Nhật ký']]};
function render(keepScroll){
  document.getElementById('roles').innerHTML=ROLES.map(function(r){return '<button type="button" data-a="role" data-id="'+r[0]+'" aria-pressed="'+(U.role===r[0])+'">'+r[1]+'</button>'}).join('');
  document.getElementById('nav').innerHTML=TABS[U.role].map(function(t){return '<button type="button" data-a="tab" data-id="'+t[0]+'"'+(U.tabs[U.role]===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join('');
  var tab=U.tabs[U.role],h='';
  if(U.role==='player')h=tab==='courses'?vPlayerCourses():tab==='tours'?vPlayerTours():vMine();

function prevPrice(){var el=document.getElementById('priceIn'),p=document.getElementById('pricePrev');if(!el||!p)return;var v=+el.value||0,c=v*D.settings.commission/100;
  p.textContent='CoachMate giữ '+D.settings.commission+'% = '+vnd(c)+' mỗi học viên. HLV nhận '+vnd(v-c)+'.'}

function closeM(){U.modal=null;render()}

/* ---------- actions ---------- */
function doEnroll(f,id){var c=course(id),S=D.settings;if(enrolls(c.id).length>=c.max){toast('Khóa đã đầy');return}
  D.me.name=f.name;D.me.phone=f.phone||'';
  D.enrollments.push({id:nid('e'),courseId:c.id,name:f.name,price:c.price,commission:Math.round(c.price*S.commission/100),payFee:Math.round(c.price*S.payFee/100),mine:true,done:false,reviewed:false});
  D.funnel.paid++;logEv(f.name+' đăng ký "'+c.title+'" ('+vnd(c.price)+', hoa hồng '+vnd(c.price*S.commission/100)+')');save();
  var st=cstat(c);U.modal={type:'ok',title:'Đăng ký thành công',lines:['Khóa: '+c.title,'Đã thanh toán '+vnd(c.price)+' ('+f.method+')',st.k==='warn'?'Lớp sẽ mở khi đủ '+c.min+' học viên. Không đủ sẽ hoàn tiền 100%.':'Lớp chắc chắn mở. Bắt đầu '+fdate(c.start)+'.'],cta:'toMine',ctaText:'Xem khóa học của tôi'};render()}
function doTreg(f,id){var t=tour(id),S=D.settings;D.me.name=f.name;D.me.phone=f.phone||'';
  D.regs.push({id:nid('r'),tid:t.id,name:f.name,partner:f.partner||'',mine:true,fee:t.fee,payFee:Math.round(t.fee*S.payFee/100)});
  logEv(f.name+' đăng ký giải "'+t.name+'" ('+vnd(t.fee)+')');save();
  U.modal={type:'ok',title:'Đăng ký giải thành công',lines:['Giải: '+t.name,'Đã đóng '+vnd(t.fee)+' ('+f.method+')','Lịch thi đấu sẽ gửi sau khi CoachMate chốt danh sách.'],cta:'toMine',ctaText:'Xem giải của tôi'};render()}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,id=el.dataset.id;
  if(a==='overlay'){if(ev.target===el)closeM();return}
  if(a==='gotour'){ev.preventDefault();U.tabs.player='tours';render();return}
  switch(a){
    case 'role':U.role=id;U.modal=null;render();break;
    case 'tab':U.tabs[U.role]=id;render();break;
    case 'close':closeM();break;
    case 'course':D.funnel.view++;save();U.modal={type:'course',id:id};render();break;
    case 'checkout':D.funnel.checkout++;save();U.modal={type:'checkout',id:id};render();break;
    case 'tour':U.modal={type:'tour',id:id};render();break;
    case 'treg':U.modal={type:'treg',id:id};render();break;
    case 'toMine':U.modal=null;U.role='player';U.tabs.player='mine';render();break;
    case 'complete':var e=D.enrollments.find(function(x){return x.id===id});e.done=true;logEv('Học viên hoàn thành khóa "'+course(e.courseId).title+'"');save();render();toast('Đã đánh dấu hoàn thành');break;
    case 'review':U.modal={type:'review',id:id};render();break;
    case 'proOn':D.subs.push({id:nid('s'),coachId:U.coachId,amount:D.settings.proPrice,months:1,date:new Date().toISOString().slice(0,10)});logEv(coach(U.coachId).name+' đăng ký Coach Pro ('+vnd(D.settings.proPrice)+')');save();render();toast('Đã bật Coach Pro');break;
    case 'proOff':D.subs.forEach(function(s){if(s.coachId===U.coachId)s.active=false});logEv(coach(U.coachId).name+' tắt Coach Pro');save();render();break;
    case 'newT':U.modal={type:'newT'};render();break;
    case 'simreg':var t=tour(id),k,add=Math.min(8,t.max-entries(t.id).length),base=entries(t.id).length;
      for(k=0;k<add;k++)D.regs.push({id:nid('r'),tid:t.id,name:POOL[(base+k+5)%POOL.length]+' '+(base+k+1),partner:t.format==='doubles'?POOL[(base+k+11)%POOL.length]+' '+(base+k+1):'',mine:false,fee:t.fee,payFee:Math.round(t.fee*D.settings.payFee/100)});
      logEv('Mô phỏng thêm '+add+' lượt đăng ký giải "'+t.name+'"');save();render();break;
    case 'gen':var tt=tour(id);genBracket(tt);logEv('Chốt đăng ký, tạo bảng đấu "'+tt.name+'" ('+entries(tt.id).length+' lượt)');save();render();toast('Đã tạo bảng đấu, sân và trọng tài');break;
    case 'reset':D=seed();U.modal=null;save();render();toast('Đã đặt lại dữ liệu mẫu');break;
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('[role=button][data-a]'))ev.target.click();if(ev.key==='Escape'&&U.modal)closeM()});

document.addEventListener('submit',function(ev){
  var form=ev.target.closest('form[data-form]');if(!form)return;ev.preventDefault();
  var f=Object.fromEntries(new FormData(form).entries()),k=form.dataset.form,id=form.dataset.id;
  if(k==='pay')doEnroll(f,id);
  else if(k==='tpay')doTreg(f,id);
  else if(k==='review'){var e=D.enrollments.find(function(x){return x.id===id}),co=coach(course(e.courseId).coachId);e.reviewed=true;co.rSum+=+f.stars;co.rCnt++;logEv('Đánh giá '+f.stars+' sao cho '+co.name);save();U.modal=null;render();toast('Cảm ơn bạn đã đánh giá')}
  else if(k==='course'){var min=+f.min,max=+f.max;
    if(!f.title.trim()||!f.venue.trim()||!(+f.price>=0)||min>max||min<1){toast('Kiểm tra lại tên khóa, địa điểm, sĩ số và học phí');return}
    var c={id:nid('k'),coachId:U.coachId,title:f.title.trim(),type:f.type,level:f.level,area:f.area,venue:f.venue.trim(),start:f.start,sessions:+f.sessions,mins:+f.mins,days:f.days,time:f.time,sched:f.sched,max:max,min:min,price:+f.price,goal:f.goal,content:f.content.split('\n').map(function(s){return s.trim()}).filter(Boolean),req:f.req};
    D.courses.push(c);logEv(coach(U.coachId).name+' đăng khóa "'+c.title+'" ('+vnd(c.price)+')');save();U.tabs.coach='overview';render();toast('Đã đăng khóa học')}
  else if(k==='cost'){var t=tour(id);['court','staff','prize','misc','ref'].forEach(function(x){t.cost[x]=+f[x]||0});t.fee=+f.fee||0;t.min=+f.min||2;
    D.regs.forEach(function(r){if(r.tid===t.id){r.fee=t.fee}});logEv('Cập nhật kế hoạch chi phí "'+t.name+'"');save();render();toast('Đã cập nhật')}
  else if(k==='newT'){var nt={id:nid('t'),name:f.name,format:f.format,level:f.level,date:f.date,venue:f.venue,fee:+f.fee,deadline:f.deadline,max:+f.max,min:+f.min,courts:+f.courts||2,prize:vnd(+f.prizeAmt)+' tiền thưởng',rules:'Loại trực tiếp, 21 điểm, 3 set.',cost:{court:+f.court,staff:+f.staff,prize:+f.prizeAmt,misc:+f.misc,ref:+f.ref},status:'open',bracket:null};
    D.tournaments.push(nt);logEv('Tạo giải "'+nt.name+'"');save();U.modal=null;render();toast('Đã tạo giải')}
  else if(k==='result'){var tr=tour(form.dataset.t),r=+form.dataset.r,i=+form.dataset.i,m=tr.bracket.rounds[r][i],sa=+f.sa,sb=+f.sb;
    if(f.sa===''||f.sb===''||sa===sb){toast('Nhập tỷ số hợp lệ, hai bên không hòa');return}
    m.sa=sa;m.sb=sb;m.w=sa>sb?m.a:m.b;propagate(tr);
    var last=tr.bracket.rounds[tr.bracket.rounds.length-1][0];if(last.w){tr.champion=last.w;tr.status='finished'}
    logEv('Kết quả '+entryName(reg(m.a))+' '+sa+'-'+sb+' '+entryName(reg(m.b)));save();render();toast('Đã lưu kết quả')}
});

document.addEventListener('input',function(ev){var t=ev.target;
  if(t.id==='fq'){U.f.q=t.value;document.getElementById('courseList').innerHTML=courseList()}
  if(t.id==='priceIn')prevPrice()});
document.addEventListener('change',function(ev){var t=ev.target;
  var map={fl:'level',fa:'area',fs:'sched',fm:'max'};
  if(map[t.id]){U.f[map[t.id]]=t.value;document.getElementById('courseList').innerHTML=courseList()}
  if(t.id==='coachSel'){U.coachId=t.value;render()}
  if(t.dataset&&t.dataset.set){D.settings[t.dataset.set]=+t.value||0;save();render()}
  if(t.dataset&&t.dataset.assume!==undefined){D.assume[t.dataset.assume]=t.value;save()}});

render();
})();
</script>

</body></html>
